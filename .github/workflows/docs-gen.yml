name: Generate new or edit documentation from changes

on:
    pull_request:

jobs:
    generate-docs:
        name: Generate docs from changes
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
          - name: Get all the metadata
            env:
                REPO: ${{ github.repository }}
                PR_NUMBER: ${{ github.event.pull_request.number }}
            run: |
                curl -sSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" > pr.json
          - name: Set variables for LLM usage
            run: |
                PR_DESCRIPTION=$(jq -r '.body // ""' pr.json)
                DIFF_URL=$(jq -r '.diff_url' pr.json)

                GIT_DIFF=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3.diff" "$DIFF_URL")

                {
                    echo "PR_DESCRIPTION<<EOF"
                    echo "$PR_DESCRIPTION"
                    echo "EOF"
                    echo "GIT_DIFF<<EOF"
                    echo "$GIT_DIFF"
                    echo "EOF"
                } >> "$GITHUB_ENV"
                 
