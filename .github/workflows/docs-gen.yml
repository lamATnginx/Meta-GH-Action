name: Generate new or edit documentation from changes

on:
    issue_comment:
        types: [created]

jobs:
    generate-docs:
        name: Generate docs from changes
        if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/generate-docs') }}
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token || secrets.GITHUB_TOKEN }}
            GEN_DOCS_HOST: http://host.docker.internal:3131
            REPO: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.issue.number }}
        steps:
          - name: Get all the metadata
            run: |
                HTTP_CODE=$(curl -sSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -w "%{http_code}" \
                -o pr.json \
                "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")

                if [ "$HTTP_CODE" -ne 200 ]; then 
                    echo "Failed to fetch metadata with code $HTTP_CODE."
                    echo "Response body:"
                    cat pr.json
                    exit 1
                fi  

          - name: Set variables for LLM usage
            run: |
                PR_DESCRIPTION=$(jq -r '.body // ""' pr.json)

                HTTP_CODE=$(curl -sSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3.diff" \
                -w "%{http_code}" \
                -o pr.diff \
                "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")

                if [ "$HTTP_CODE" -ne 200 ]; then 
                    echo "Failed to fetch metadata with code $HTTP_CODE."
                    echo "Response body:"
                    cat pr.diff
                    exit 1
                fi 

                GIT_DIFF="$(cat pr.diff)"

                {
                    echo "PR_DESCRIPTION<<EOF"
                    echo "$PR_DESCRIPTION"
                    echo "EOF"
                    echo "GIT_DIFF<<EOF"
                    echo "$GIT_DIFF"
                    echo "EOF"
                } >> "$GITHUB_ENV"
          - name: Generate docs 
            run: |
                jq -n \
                --arg git_diff "$GIT_DIFF" \
                --arg user_summary_prompt "$PR_DESCRIPTION" \
                '{ delivery: "github", git_data: { git_diff: $git_diff }, user_summary_prompt: $user_summary_prompt}' > payload.json

                curl --location "${GEN_DOCS_HOST}/generate-docs" \
                --header "Content-Type: application/json" \
                --data @payload.json